        }

            border: 1px solid #995b44;
            background-color: #e9d4c3;

            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .start-btn:hover {
            background-color: #ddbea8;
        }
        /* 答题面板 */
        .question-wrap {
            display: none;
        }
        .progress {
            font-size: 16px;
            color: #8c5f47;
            text-align: center;
            margin-bottom: 24px;
        }
        /* 题目字号大，选项字号小，区分开 */
        .question-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 26px;
            line-height: 1.7;
        }
        .option-item {
            font-size: 18px;
            border: 1px solid #d4b8a3;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

            background-color: #f2e3d5;
        }
        .option-item.selected {
            background-color: #d9b99f;
            border-color: #b07e62;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
        }
        .btn-row button {
            font-size: 17px;
            padding: 10px 24px;
            border: 1px solid #995b44;
            background-color: #e9d4c3;
            color: #633427;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* 结果面板 */
        .result-wrap {
            display: none;
            text-align: center;
        }
        .result-title {
            font-size: 28px;
            color: #803b3b;
            margin-bottom: 22px;
        }
        .result-desc {
            font-size: 19px;
            line-height: 1.9;
            text-align: left;
            margin-bottom: 34px;
        }

            font-size: 20px;
            padding: 12px 36px;
            border: 1px solid #995b44;
            background-color: #e9d4c3;
            color: #633427;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>

        <div class="result-wrap" id="resultBox">

            <div class="result-desc" id="resText"></div>

        </div>

let current = 0;
let score = 0;
let userAnswers = [];

// 开始测试
function startTest() {
    document.getElementById("startBox").style.display = "none";
    document.getElementById("qBox").style.display = "block";
    renderQuestion();
}

// 渲染当前题目
function renderQuestion() {
    const q = questionList[current];
    document.getElementById("progressText").innerText = `第 ${current+1} / 18 题`;
    document.getElementById("qTitle").innerText = q.q;
    const optWrap = document.getElementById("optWrap");
    optWrap.innerHTML = "";
    q.opt.forEach((item,idx)=>{
        let selected = userAnswers[current] === idx ? "selected" : "";
        optWrap.innerHTML += `<div class="option-item ${selected}" onclick="selectOption(${idx})">${item.t}</div>`
    })
    // 控制上一题按钮
    document.getElementById("prevBtn").disabled = current === 0;
}

// 选择选项
function selectOption(idx) {
    userAnswers[current] = idx;
    renderQuestion();
}

// 上一题
function prevQuestion() {
    if(current > 0) {
        current--;
        renderQuestion();
    }
}

// 下一题 / 出结果
function nextQuestion() {
    if(userAnswers[current] === undefined) return alert("请选择一个选项！");
    if(current < questionList.length -1) {
        current++;
        renderQuestion();
    } else {
        showResult();
    }
}

// 计算结果
function showResult() {
    score = 0;
    userAnswers.forEach((idx, qIdx)=>{
        score += questionList[qIdx].opt[idx].s;
    })
    let res = resultList.find(r=> score >= r.min && score <= r.max);
    document.getElementById("qBox").style.display = "none";
    document.getElementById("resultBox").style.display = "block";
    document.getElementById("resTitle").innerText = res.title;
    document.getElementById("resText").innerText = res.text;
}

// 重置全部
function resetAll() {
    current = 0;
    score = 0;
    userAnswers = [];
    document.getElementById("startBox").style.display = "block";
    document.getElementById("qBox").style.display = "none";
